<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta id="meta-desc" name="description" content="NeuroDynamics is a nonprofit health-tech research and development initiative at the School of Engineering of the Federal University of Minas Gerais (UFMG). Software, firmware, embedded systems and AI in service of human health.">
<meta name="theme-color" content="#050807"> <!-- auditar: ok, theme-color exige valor literal -->
<title>NeuroDynamics | Nonprofit Health-Tech R&D</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/casca.css">
<style>
:root{
  /* papéis, tipo e forma vêm de ds/tokens.css; aqui só o que é do site */
  --abertura:rgba(var(--tom),.028);
  /* da borda da tela até a coluna do texto (main: --max com 26px de cada lado);
     o trilho e o mosaico saem da coluna e voltam com esta medida */
  --sangria:max(26px, calc((100vw - var(--max)) / 2 + 26px));
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip} /* a luz atrás do vidro (.luz) passa da borda; nunca vira rolagem lateral */
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.015em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
img{max-width:100%}
[hidden]{display:none!important}
::selection{background:rgba(var(--tom),.16);color:var(--ink)}

/* ============ BACKGROUND ============ */
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(120% 90% at 72% -12%, var(--painel) 0%, var(--bg) 58%)}
#bg::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(var(--abertura) 1px,transparent 1px),
                   linear-gradient(90deg,var(--abertura) 1px,transparent 1px);
  background-size:130px 130px;
  -webkit-mask-image:radial-gradient(85% 62% at 50% 26%, var(--void) 0%, transparent 100%);
          mask-image:radial-gradient(85% 62% at 50% 26%, var(--void) 0%, transparent 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform;opacity:.32}
.b1{width:56vmax;height:56vmax;left:-18vmax;top:-24vmax;
  background:radial-gradient(circle,var(--axon) 0%,transparent 70%);
  animation:fl1 38s ease-in-out infinite alternate}
.b2{width:42vmax;height:42vmax;right:-16vmax;top:8vmax;opacity:.2;
  background:radial-gradient(circle,var(--axon) 0%,transparent 70%);
  animation:fl2 32s ease-in-out infinite alternate}
.b3{width:30vmax;height:30vmax;left:36vw;bottom:-18vmax;opacity:.06;
  background:radial-gradient(circle,var(--synapse) 0%,transparent 70%);
  animation:fl3 44s ease-in-out infinite alternate}
@keyframes fl1{from{transform:translate(0,0) scale(1)}to{transform:translate(8vw,6vh) scale(1.14)}}
@keyframes fl2{from{transform:translate(0,0) scale(1.08)}to{transform:translate(-10vw,10vh) scale(.94)}}
@keyframes fl3{from{transform:translate(0,0) scale(1)}to{transform:translate(-7vw,-12vh) scale(1.2)}}
@media (prefers-reduced-motion:reduce){
  .blob,.mq-track,.wave path{animation:none!important}
  *{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ============ FLOATING HEADER ============ */
/* language selector */

/* ============ FULLSCREEN MENU ============ */
@keyframes mrise{to{transform:none;opacity:1}}

/* ============ LAYOUT PRIMITIVES ============ */
main{max-width:var(--max);margin:0 auto;padding:0 26px}
section{margin:0 0 clamp(90px,12vh,150px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:600;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.eyebrow::before{content:'';width:7px;height:7px;background:var(--syn);flex-shrink:0}
.sec-head{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start;margin-bottom:48px}
.sec-head h2{font-size:clamp(28px,4vw,46px);font-weight:600;line-height:1.08;max-width:640px}
.sec-head .sub{color:var(--muted);max-width:560px;margin-top:14px;font-size:15.5px}
@media (max-width:820px){.sec-head{grid-template-columns:1fr;gap:14px}}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .25s var(--ease),transform .25s var(--ease)}
.reveal.viu{opacity:1;transform:none}
.reveal.ja{transition:none}
.pg-head{padding-top:170px;margin-bottom:clamp(60px,9vh,110px)}
.pg-head h1{font-size:clamp(38px,6.4vw,74px);font-weight:600;line-height:1.04;letter-spacing:-.025em;
  max-width:900px;margin:20px 0 22px}
.pg-head .lead{font-size:clamp(15.5px,1.7vw,18px);color:var(--muted);max-width:640px}

/* ============ HERO ============ */
#hero{display:flex;flex-direction:column;justify-content:center;
  padding:150px 0 0;position:relative;margin-bottom:clamp(44px,7vh,72px)}
#hero h1{font-size:clamp(40px,6.6vw,84px);font-weight:600;letter-spacing:-.03em;line-height:.98;
  margin:22px 0 26px;max-width:1000px}
.hero-sub{font-size:clamp(15.5px,1.75vw,19px);color:var(--muted);max-width:560px;margin-bottom:34px}
.hero-sub b{color:var(--ink);font-weight:600}
.hero-acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:12px;
  font-family:var(--fd);font-weight:600;font-size:14px;white-space:nowrap;
  transition:transform .15s, box-shadow .15s, background .15s, border-color .15s}
.btn.solid{background:var(--ink);color:var(--cortex)}
.btn.solid:hover{transform:translateY(-1px);border-color:var(--ink)}
.btn.ghost{border:1px solid var(--line2);color:var(--ink);background:rgba(255,255,255,.03)}
.btn.ghost:hover{background:rgba(255,255,255,.07);border-color:var(--dim)}
.btn .ar{width:15px;height:15px}
.wave{position:absolute;right:-6vw;top:16%;width:56vw;max-width:820px;opacity:.5;pointer-events:none;z-index:-1}
.wave path{fill:none;stroke:rgba(206,220,0,.16);stroke-width:1.4;
  stroke-dasharray:6 7;animation:dashmove 26s linear infinite}
.wave path.p2{stroke:rgba(45,212,191,.12);animation-duration:34s;animation-direction:reverse}
@keyframes dashmove{to{stroke-dashoffset:-260}}
@media (max-width:820px){.wave{display:none}}

/* ============ STATEMENT ============ */
.statement{display:grid;grid-template-columns:220px 1fr;gap:26px}
@media (max-width:820px){.statement{grid-template-columns:1fr;gap:14px}}
.statement .big{font-family:var(--fd);font-size:clamp(21px,2.9vw,32px);font-weight:500;
  line-height:1.42;letter-spacing:-.012em;max-width:880px}
.statement .big b{font-weight:600;color:var(--ink)}
.statement .big .soft{color:var(--dim)}
.statement .after{color:var(--muted);max-width:640px;margin-top:26px;font-size:15.5px}

/* ============ RODAPÉ DE LISTA (notícias do início) ============ */
.pgrid-foot{display:flex;justify-content:flex-end;margin-top:26px}
@media (max-width:860px){.pgrid-foot .btn{width:100%;justify-content:center}}

/* ============ IMAGE PLACEHOLDER ============ */
.ph{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 130% at 18% -10%,rgba(0,89,79,.28),transparent 58%),var(--panel)}
.ph.tall{aspect-ratio:4/3}
.ph::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(245,245,247,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(245,245,247,.03) 1px,transparent 1px);
  background-size:44px 44px}
.ph .glyph{position:absolute;right:-4%;bottom:-22%;font-family:var(--fd);font-weight:700;
  font-size:min(46cqw,240px);line-height:1;color:rgba(245,245,247,.045);user-select:none;letter-spacing:-.04em}
.ph .fig{position:absolute;left:14px;bottom:12px;font-family:var(--fd);font-weight:600;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ph .fig em{font-style:normal;color:var(--muted)}
.ph .crop{position:absolute;width:14px;height:14px;color:rgba(245,245,247,.25)}
.ph .crop.tl{top:10px;left:10px;border-top:1px solid;border-left:1px solid}
.ph .crop.tr{top:10px;right:10px;border-top:1px solid;border-right:1px solid}
.ph .crop.bl{bottom:10px;left:10px;border-bottom:1px solid;border-left:1px solid}
.ph .crop.br{bottom:10px;right:10px;border-bottom:1px solid;border-right:1px solid}
.ph img.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{container-type:inline-size}

/* ============ PARTNERS MARQUEE ============ */
.mq-wrap{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:25px 0}
.mq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,var(--void) 14%,var(--void) 86%,transparent);
  mask-image:linear-gradient(90deg,transparent,var(--void) 14%,var(--void) 86%,transparent)}
.mq-track{display:flex;align-items:center;gap:0;width:max-content;animation:mq 42s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-item{display:flex;align-items:center;gap:14px;padding:0 44px;flex-shrink:0;
  opacity:.5;filter:grayscale(1);transition:opacity .2s}
.mq-item:hover{opacity:.95}
.mq-item img{height:60px;width:auto}
.mq-item .tm{font-family:var(--fd);font-weight:700;font-size:34px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.mq-item .tm small{display:block;font-family:var(--fd);font-weight:600;font-weight:400;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px}

/* ============ ABOUT ============ */
.chan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.chan-grid{grid-template-columns:1fr}}
.chan{border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;background:var(--card);
  display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .2s}
a.chan:hover{border-color:var(--line2);transform:translateY(-3px)}
.chan .lb{font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.chan .vl{font-family:var(--fd);font-size:17px;font-weight:600;word-break:break-word}
.chan p{font-size:13px;color:var(--muted)}
.chan .go{margin-top:auto;padding-top:8px;font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
a.chan:hover .go{color:var(--syn)}

/* ============ NONPROFIT LEDGER (about page) ============ */
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;background:var(--card)}
@media (max-width:820px){.ledger{grid-template-columns:1fr}}
.ledger .cell{padding:30px 28px;border-right:1px solid var(--line)}
.ledger .cell:last-child{border-right:none}
@media (max-width:820px){
  .ledger .cell{border-right:none;border-bottom:1px solid var(--line)}
  .ledger .cell:last-child{border-bottom:none}
}
.ledger .k{font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);display:block;margin-bottom:14px}
.ledger .v{font-family:var(--fd);font-size:clamp(19px,2.3vw,25px);font-weight:600;
  line-height:1.2;letter-spacing:-.015em;margin-bottom:10px}
.ledger .v em{font-style:normal;color:var(--syn)}
.ledger p{font-size:13.5px;color:var(--muted)}

/* ============ PRESS VIDEOS (about page carousel) ============ */
.press{max-width:1000px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  backdrop-filter:blur(6px);overflow:hidden}
.vstage{position:relative;aspect-ratio:16/9;background:var(--void)}
.vstage video,.vstage iframe{position:absolute;inset:0;width:100%;height:100%;
  border:0;display:block;object-fit:contain;background:var(--void)}
.vstage .vframe{position:absolute;inset:0}
.vgate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(4,7,6,.5);backdrop-filter:blur(2px);width:100%;color:var(--ink)}
.press.gated .vgate{display:flex}
.vgate i{width:72px;height:72px;border-radius:50%;border:1px solid var(--line2);
  background:rgba(7,12,10,.62);display:grid;place-items:center;
  transition:transform .2s,border-color .2s}
.vgate:hover i{transform:scale(1.06);border-color:var(--syn)}
.vgate svg{width:22px;height:22px;margin-left:4px}
.vmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86%;text-align:center;
  font-family:var(--fm);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.vbar{height:2px;background:rgba(245,245,247,.07)}
.vbar i{display:block;height:100%;width:0;background:var(--syn);transition:width .25s linear}
.vinfo{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:14px 18px}
.vinfo .no{font-family:var(--fm);font-size:11px;letter-spacing:.12em;color:var(--syn);flex-shrink:0}
.vinfo .ttl{font-family:var(--fd);font-size:15px;font-weight:600;line-height:1.3}
.vinfo .src{font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vacts{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.vbtn{width:36px;height:36px;border:1px solid var(--line2);border-radius:10px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);
  transition:color .15s,border-color .15s,background .15s}
.vbtn:hover{color:var(--ink);border-color:var(--dim);background:rgba(255,255,255,.05)}
.vbtn svg{width:16px;height:16px}
.vbtn.lnk{width:auto;padding:0 13px;font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.vbtn.lnk svg{width:12px;height:12px}
.vrail{display:flex;border-top:1px solid var(--line);overflow-x:auto;
  scroll-snap-type:x mandatory;scrollbar-width:none}
.vrail::-webkit-scrollbar{display:none}
.vitem{position:relative;flex:0 0 74%;text-align:left;padding:15px 18px;scroll-snap-align:start;
  display:flex;flex-direction:column;gap:3px;border-left:1px solid var(--line);transition:background .2s}
.vitem:first-child{border-left:0}
.vitem:hover{background:rgba(255,255,255,.04)}
.vitem .no{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
.vitem .ttl{font-family:var(--fd);font-size:13.5px;font-weight:500;color:var(--muted);line-height:1.35}
.vitem .src{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.vitem.on{background:rgba(255,255,255,.05)}
.vitem.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--ink)}
.vitem.on .no{color:var(--syn)}
.vitem.on .ttl{color:var(--ink)}
@media (min-width:861px){.vitem{flex:1 1 0;min-width:0}}
/* written coverage: smaller cards under the player */
.pnote{display:flex;align-items:center;gap:16px;margin:38px 0 16px}
.pnote span{flex-shrink:0;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim)}
.pnote::after{content:'';flex:1;height:1px;background:var(--line)}
.chan.art{padding:22px 20px}
.chan.art .lb{color:var(--muted)}
.chan.art .vl{font-size:15px;font-weight:600;line-height:1.4;word-break:normal;overflow-wrap:anywhere}
@media (max-width:520px){
  .vinfo{padding:13px 15px}
  .vacts{width:100%;margin-left:0;justify-content:flex-end}
}

/* ============ FAMÍLIAS ============ */
/* Cada projeto tem uma família secundária do manual: chapada, em
   texto, linha e preenchimento. Brilho e vidro são do conjunto
   primário (Cortex, Axon); a única exceção é a banda de família. */
.f-ion{--fam-light:var(--ion-light);--fam-medium:var(--ion-medium);--fam-primary:var(--ion-primary);--fam-dark:var(--ion-dark)}
.f-neuron{--fam-light:var(--neuron-light);--fam-medium:var(--neuron-medium);--fam-primary:var(--neuron-primary);--fam-dark:var(--neuron-dark)}
.f-glia{--fam-light:var(--glia-light);--fam-medium:var(--glia-medium);--fam-primary:var(--glia-primary);--fam-dark:var(--glia-dark)}
.f-retina{--fam-light:var(--retina-light);--fam-medium:var(--retina-medium);--fam-primary:var(--retina-primary);--fam-dark:var(--retina-dark)}
.f-nexo{--fam-light:var(--nexo-light);--fam-medium:var(--nexo-medium);--fam-primary:var(--nexo-primary);--fam-dark:var(--nexo-dark)}
.f-dendrito{--fam-light:var(--dendrito-light);--fam-medium:var(--dendrito-medium);--fam-primary:var(--dendrito-primary);--fam-dark:var(--dendrito-dark)}
.f-lumen{--fam-light:var(--lumen-light);--fam-medium:var(--lumen-medium);--fam-primary:var(--lumen-primary);--fam-dark:var(--lumen-dark)}
.f-ritmo{--fam-light:var(--ritmo-light);--fam-medium:var(--ritmo-medium);--fam-primary:var(--ritmo-primary);--fam-dark:var(--ritmo-dark)}
.f-impulso{--fam-light:var(--impulso-light);--fam-medium:var(--impulso-medium);--fam-primary:var(--impulso-primary);--fam-dark:var(--impulso-dark)}
.f-plexo{--fam-light:var(--plexo-light);--fam-medium:var(--plexo-medium);--fam-primary:var(--plexo-primary);--fam-dark:var(--plexo-dark)}
.f-iris{--fam-light:var(--iris-light);--fam-medium:var(--iris-medium);--fam-primary:var(--iris-primary);--fam-dark:var(--iris-dark)}
.f-nenhuma{--fam-light:var(--pia-light);--fam-medium:var(--pia-medium);--fam-primary:var(--pia-primary);--fam-dark:var(--pia-dark)}

/* ============ VIDRO ============ */
/* Superfície de vidro sobre o fundo: preenchimento claro mínimo, borda
   de 1px e o desfoque do manual. A luz atrás (.luz) é Axon e Cortex. */
.vidro{position:relative;border:1px solid rgba(var(--ink-rgb),.1);border-radius:var(--r-xl);
  background:linear-gradient(180deg,rgba(var(--tom),.06),rgba(var(--tom),.018));
  -webkit-backdrop-filter:var(--blur-glass);backdrop-filter:var(--blur-glass);
  box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.06)}
.luz{position:absolute;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(90px);opacity:.38;
  background:radial-gradient(circle,var(--axon) 0%,transparent 68%)}
.luz.c{background:radial-gradient(circle,var(--cortex-medium) 0%,transparent 66%);opacity:.08}
.st{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:var(--tr-label);text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line2);border-radius:var(--r-tag);padding:3px 8px;white-space:nowrap}

/* ============ PROJECTS: O ÍNDICE ============ */
.pj-filtro{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:var(--r-md);margin-bottom:26px}
.pj-filtro button{height:36px;padding:0 15px;border-radius:10px;font-family:var(--fd);font-weight:600;font-size:12.5px;
  color:var(--muted);transition:background var(--t-fast),color var(--t-fast)}
.pj-filtro button:hover{color:var(--ink);background:rgba(var(--tom),.05)}
.pj-filtro button.on{background:rgba(var(--tom),.09);color:var(--ink)}
.pj-filtro button:focus-visible,.pj-chips button:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.pj-grade{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;position:relative}
.pj-card{grid-column:span 4;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s var(--ease),border-color .25s}
.pj-card.g8{grid-column:span 8}
.pj-card.g6{grid-column:span 6}
.pj-card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--fam-medium) 55%,transparent)}
.pj-card:focus-visible{outline:2px solid var(--foco);outline-offset:3px}
.pj-img{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--void);border-bottom:1px solid var(--line);flex:1 0 auto}
.pj-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s var(--ease)}
.pj-card:hover .pj-img img,.tr-card:hover .pj-img img{transform:scale(1.03)}

/* ============ TRILHO (os projetos no início) ============ */

   o primeiro cartão alinha com o texto */
.trilho-topo{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}
.trilho-topo h2{font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.15}

  background:rgba(var(--tom),.03);display:inline-flex;align-items:center;justify-content:center;
  transition:background var(--t-fast),border-color var(--t-fast),opacity var(--t-fast)}
.trilho-ctl button:hover:not(:disabled){background:rgba(var(--tom),.08);border-color:var(--dim)}

@media (hover:none){.trilho-ctl{display:none}}
.trilho-pista{display:grid;grid-auto-flow:column;grid-auto-columns:min(78vw,500px);gap:16px;
  overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:0 calc(-1 * var(--sangria));padding:6px var(--sangria) 26px;scroll-padding-inline:var(--sangria)}

  transition:transform .25s var(--ease),border-color .25s}

.tr-card:focus-visible{outline:2px solid var(--foco);outline-offset:3px}

/* ============ TROCA DE PÁGINA (View Transitions) ============ */
/* a tela como estava esmaece e a nova sobe um pouco; o cabeçalho fica
   parado (é o mesmo nas duas). O palco do projeto e o pôster do cartão
   clicado dividem o nome pj-midia: um vira o outro. A tela inteira (root),
   e não o #main, porque a imagem dela é a da rolagem em que se estava */
.nd-cab{view-transition-name:cabecalho}
.pj-tela{view-transition-name:pj-midia}
::view-transition-old(root){animation:.15s var(--ease) both vt-sai}
::view-transition-new(root){animation:.25s var(--ease) both vt-entra}
::view-transition-group(pj-midia){animation-duration:.25s;animation-timing-function:var(--ease)}
::view-transition-old(pj-midia),::view-transition-new(pj-midia){height:100%;object-fit:cover;overflow:clip}
@keyframes vt-sai{to{opacity:0}}
@keyframes vt-entra{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

/* the language in play: an explicit choice wins, then what the
   visitor picked last time, then the browser's, then English */
const LANGS = ['en','pt','fr'];
function pickLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try{ const s = localStorage.getItem('nd-lang'); if (LANGS.includes(s)) return s; }catch(_){}
  const nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  return LANGS.includes(nav) ? nav : 'en';
}

/* ============================================================
   PRESS CAROUSEL — markup + player. One clip is on stage at a
   time; it starts muted (the only kind of autoplay browsers
   allow), advances by itself when it ends, and pauses whenever
   it scrolls out of view so we are not streaming to nobody.
   Handles both hosted files (<video>) and YouTube (iframe API).
   ============================================================ */
/* auto = may start without a click (off under reduced motion, or once a
   browser refuses autoplay) · want = should be running right now
   · vis = on screen · quiet = timestamp of a pause we caused ourselves */
const press = { i:0, muted:true, auto:true, want:true, vis:false, quiet:0,
                el:null, vid:null, box:null, yt:null, poll:null, io:null, fails:0 };

/* a clip with no title of its own is labelled by who aired it */
const vTitle = v => v.title || v.outlet || T().about.press.fallback;
const vLabel = v => (v.title ? [v.outlet, v.date] : [v.date]).filter(Boolean).join(', ');

function pressSection(){
  if (!PRESS_ON) return '';
  const t = T().about.press;
  const many = PRESS_VIDEOS.length > 1;
  const rail = !many ? '' : `<div class="vrail" id="vrail">${PRESS_VIDEOS.map((v,i)=>`
      <button class="vitem${i?'':' on'}" type="button" data-i="${i}">
        <span class="no">${String(i+1).padStart(2,'0')}</span>
        <span class="ttl">${esc(vTitle(v))}</span>
        <span class="src">${esc(vLabel(v))}</span>
      </button>`).join('')}</div>`;

  const player = !PRESS_VIDEOS.length ? '' : `
    <div class="press reveal" id="press">
      <div class="vstage" id="vstage">
        <video id="vplay" playsinline muted controls preload="metadata"
               aria-label="${esc(t.fallback)}"></video>
        <div class="vframe" id="vframe" hidden></div>
        <p class="vmsg" id="vmsg" hidden></p>
        <button class="vgate" id="vgate" type="button" aria-label="${esc(t.play)}">
          <i>${IC.play}</i>
        </button>
      </div>
      <div class="vbar"><i id="vprog"></i></div>
      <div class="vinfo">
        <span class="no" id="vno">01</span>
        <span class="ttl" id="vttl"></span>
        <span class="src" id="vsrc"></span>
        <span class="vacts">
          <a class="vbtn lnk" id="vlink" target="_blank" rel="noopener" hidden>${esc(t.source)} ${IC.ne}</a>
          <button class="vbtn" id="vsound" type="button" aria-label="${esc(t.unmute)}">${IC.mute}</button>
          ${many ? `<button class="vbtn" id="vprev" type="button" aria-label="${esc(t.prev)}">${IC.prev}</button>
          <button class="vbtn" id="vnext" type="button" aria-label="${esc(t.next)}">${IC.next}</button>` : ''}
        </span>
      </div>
      ${rail}
    </div>`;

  const read = !PRESS_ARTICLES.length ? '' : `
    <div class="pnote reveal"><span>${esc(t.also)}</span></div>
    <div class="chan-grid">${PRESS_ARTICLES.map(a=>`
      <a class="chan art reveal" href="${esc(a.href)}" target="_blank" rel="noopener">
        <span class="lb">${esc([a.outlet, a.date].filter(Boolean).join(', '))}</span>
        <span class="vl">${esc(a.title)}</span>
        <span class="go">${esc(t.read)} ${IC.ne}</span>
      </a>`).join('')}</div>`;

  return `
  <section>
    <div class="sec-head reveal">
      <span class="eyebrow">${eyebrow(t.lb)}</span>
      <div>
        <h2>${t.h2}</h2>
        ${t.sub ? `<p class="sub">${t.sub}</p>` : ''}
      </div>
    </div>
    ${player}
    ${read}
  </section>`;
}

/* the YouTube iframe API is only fetched if some clip needs it */
let ytApi = null;
function ytLoad(){
  return ytApi || (ytApi = new Promise((ok, fail)=>{
    if (window.YT?.Player) return ok(window.YT);
    const before = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ before?.(); ok(window.YT); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = fail;
    document.head.appendChild(s);
  }));
}
function ytDrop(){
  try{ press.yt?.destroy?.(); }catch(_){}
  press.yt = null;
  if (press.box) press.box.innerHTML = '';
}
/* leaving YouTube for a hosted file: a hidden iframe keeps playing, so say stop */
function ytStop(){ try{ press.yt?.pauseVideo?.(); }catch(_){} }

/* progress for the YouTube player has to be polled — it has no timeupdate */
function ytWatch(){
  clearInterval(press.poll);
  press.poll = setInterval(()=>{
    if (press.yt?.getDuration) pressProg(press.yt.getCurrentTime(), press.yt.getDuration());
  }, 250);
}

function ytState(e){
  if (!PRESS_VIDEOS[press.i]?.youtube) return;   // stale event from the hidden player
  if (e.data === 1){ press.fails = 0; press.want = true; }                  // playing
  else if (e.data === 2 && Date.now() - press.quiet > 400) press.want = false; // visitor paused
  else if (e.data === 0) pressGo(press.i+1, false);                         // ended
}

/* One player for the whole carousel: the first clip builds the iframe, every
   clip after that is swapped into it — remounting costs a second each time. */
function ytShow(id){
  if (press.yt?.loadVideoById){
    (press.want && press.vis) ? press.yt.loadVideoById(id) : press.yt.cueVideoById(id);
    press.muted ? press.yt.mute?.() : press.yt.unMute?.();
    ytWatch();
    return;
  }
  const seat = document.createElement('div');
  press.box.innerHTML = '';
  press.box.appendChild(seat);
  ytLoad().then(YT => {
    if (!seat.isConnected) return;               // route changed while loading
    press.yt = new YT.Player(seat, {
      videoId: id,
      host: 'https://www.youtube-nocookie.com',
      /* autoplay stays off: playback is ours to start, once the clip is on screen */
      playerVars: { autoplay:0, mute:1, rel:0, playsinline:1, modestbranding:1,
        ...(location.protocol.startsWith('http') ? { origin: location.origin } : {}) },
      events: {
        onReady: e => {
          press.muted ? e.target.mute() : e.target.unMute();
          if (press.want && press.vis) e.target.playVideo();
          ytWatch();
        },
        onStateChange: ytState,
        onError: pressFail
      }
    });
  }).catch(pressFail);
}

function pressInit(){
  if (!PRESS_VIDEOS.length || !$('#press')) return;
  const auto = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  Object.assign(press, { i:0, muted:true, vis:false, quiet:0, fails:0, auto, want:auto,
    el:$('#press'), vid:$('#vplay'), box:$('#vframe') });

  press.vid.addEventListener('ended', ()=>pressGo(press.i+1, false));
  press.vid.addEventListener('error', pressFail);
  press.vid.addEventListener('playing', ()=>{ press.fails = 0; });
  press.vid.addEventListener('play', ()=>{ press.want = true; });
  /* these read e.target: events can still land after the page is torn down */
  press.vid.addEventListener('timeupdate', e => pressProg(e.target.currentTime, e.target.duration));
  /* a pause we did not cause is the visitor's — respect it */
  press.vid.addEventListener('pause', e => {
    if (!e.target.ended && Date.now() - press.quiet > 400) press.want = false;
  });

  $('#vgate').addEventListener('click', ()=>{ press.auto = true; press.want = true; pressPaint(); pressPlay(); });
  $('#vsound').addEventListener('click', pressSound);
  $('#vprev')?.addEventListener('click', ()=>pressGo(press.i-1, true));
  $('#vnext')?.addEventListener('click', ()=>pressGo(press.i+1, true));
  $('#vrail')?.querySelectorAll('.vitem').forEach(b =>
    b.addEventListener('click', ()=>pressGo(+b.dataset.i, true)));

  /* nothing streams while the player is off-screen; it picks up on return */
  press.io = new IntersectionObserver(es=>es.forEach(e=>{
    press.vis = e.isIntersecting;
    if (press.vis){ if (press.want) pressPlay(); }
    else pressPause();
  }), { threshold:.2 });
  press.io.observe($('#vstage'));

  pressLoad();
  pressPaint();
}

function pressDestroy(){
  clearInterval(press.poll); press.poll = null;
  press.io?.disconnect(); press.io = null;
  ytDrop();
  if (press.vid){ try{ press.vid.pause(); press.vid.removeAttribute('src'); press.vid.load(); }catch(_){} }
  press.el = press.vid = press.box = null;
}

function pressPlay(){
  if (!press.el) return;
  if (PRESS_VIDEOS[press.i].youtube){ press.yt?.playVideo?.(); return; }
  press.vid.play?.().catch(e => {
    /* only a refusal to autoplay is worth a play button; an AbortError just
       means our own pause or the next clip's load got there first */
    if (e?.name === 'NotAllowedError'){ press.auto = press.want = false; pressPaint(); }
  });
}
function pressPause(){
  press.quiet = Date.now();
  if (PRESS_VIDEOS[press.i]?.youtube) press.yt?.pauseVideo?.();
  else press.vid?.pause();
}

function pressGo(n, byUser){
  if (!press.el) return;
  press.i = (n + PRESS_VIDEOS.length) % PRESS_VIDEOS.length;
  if (byUser) press.auto = press.want = true;
  else press.want = press.auto;
  pressLoad();
  pressPaint();
}

function pressLoad(){
  const v = PRESS_VIDEOS[press.i];
  clearInterval(press.poll); press.poll = null;
  press.quiet = Date.now();
  pressProg(0, 0);
  $('#vmsg').hidden = true;

  if (v.youtube){
    try{ press.vid.pause(); press.vid.removeAttribute('src'); press.vid.load(); }catch(_){}
    press.vid.hidden = true;
    press.box.hidden = false;
    ytShow(v.youtube);
  } else {
    ytStop();
    press.box.hidden = true;
    press.vid.hidden = false;
    press.vid.muted = press.muted;
    if (v.poster) press.vid.poster = v.poster; else press.vid.removeAttribute('poster');
    press.vid.src = v.src || '';
    press.vid.load();
    if (press.want && press.vis) pressPlay();
  }
}


/* a clip that will not load should not stall the carousel */
function pressFail(){
  if (!press.el) return;
  if (++press.fails >= PRESS_VIDEOS.length){
    const m = $('#vmsg');
    if (m){ m.textContent = T().about.press.failed; m.hidden = false; }
    return;
  }
  pressGo(press.i+1, false);
}

function pressSound(){
  press.muted = !press.muted;
  if (PRESS_VIDEOS[press.i].youtube) press.muted ? press.yt?.mute?.() : press.yt?.unMute?.();
  else press.vid.muted = press.muted;
  if (!press.muted){ press.auto = press.want = true; pressPlay(); }
  pressPaint();
}

function pressProg(now, total){
  const bar = $('#vprog');
  if (bar) bar.style.width = (total > 0 ? Math.min(100, now / total * 100) : 0) + '%';
}

function pressPaint(){
  if (!press.el) return;
  const v = PRESS_VIDEOS[press.i];
  press.el.classList.toggle('gated', !press.auto);
  $('#vno').textContent  = String(press.i+1).padStart(2,'0');
  $('#vttl').textContent = vTitle(v);
  $('#vsrc').textContent = vLabel(v);
  const link = $('#vlink');
  link.hidden = !v.href;
  if (v.href) link.href = v.href;
  const snd = $('#vsound');
  snd.innerHTML = press.muted ? IC.mute : IC.vol;
  snd.setAttribute('aria-label', press.muted ? T().about.press.unmute : T().about.press.mute);
  const rail = $('#vrail');
  rail?.querySelectorAll('.vitem').forEach(b=>{
    const on = +b.dataset.i === press.i;
    b.classList.toggle('on', on);
    b.setAttribute('aria-current', on ? 'true' : 'false');
    if (on) rail.scrollTo({ left: b.offsetLeft, behavior:'smooth' });
  });
}

/* ---------------- data ---------------- */
async function loadProjects(){
  if (state.loaded || !sb) return;
  try{
    const { data, error } = await sb.rpc('site_projetos_publico');
    if (!error && Array.isArray(data) && data.length){
      state.projects = data;
      state.loaded = true;
      // re-render with fresh data, but only where projects are shown;
      // a project page only repaints its text, never the animation
      const r = route();
      if (r === 'projects' && rotaProjeto()){ if (projeto.dados) projetoPintar(); }
      else if (r === 'home' || r === 'projects') render(r);
    }
  }catch(_){ /* fallback content stays */ }
}

/* The press lists live in the database (see PRESS_VIDEOS). The page
   only re-renders when they differ from what is already on screen, so
   a visitor who is already watching the fallback list is not reset. */
async function loadPress(){
  if (!sb) return;
  try{
    const { data, error } = await sb.rpc('site_imprensa_publico');
    if (error || !Array.isArray(data?.videos)) return;
    const videos = data.videos.filter(v => v.youtube || v.arquivo).map(v => ({
      title: v.titulo || '', outlet: v.veiculo || '', date: v.ano || '',
      ...(v.youtube ? { youtube: v.youtube } : { src: v.arquivo, poster: v.capa || '' }),
      ...(v.url ? { href: v.url } : {}) }));
    const articles = (data.materias || []).map(m => ({ title: m.titulo, outlet: m.veiculo || '', date: m.ano || '', href: m.url }));
    const key = (vs, as) => JSON.stringify([vs.map(v => [v.title || '', v.outlet || '', v.date || '', v.youtube || v.src || '', v.href || '']),
                                            as.map(a => [a.title, a.outlet || '', a.date || '', a.href])]);
    const same = key(videos, articles) === key(PRESS_VIDEOS, PRESS_ARTICLES);
    PRESS_VIDEOS = videos; PRESS_ARTICLES = articles;
    PRESS_ON = videos.length > 0 || articles.length > 0;
    if (!same && route() === 'about') render('about');
  }catch(_){ /* fallback content stays */ }
}

  if (projeto.slug === slug && projeto.dados) return projeto.dados;
  const daLista = state.projects.find(p => p.slug === slug);

  /* o banco respondeu à lista, mas a página ainda não: números e produção

function projetoInit(){
  const slug = rotaProjeto(), vez = ++projeto.vez;
  if (projeto.slug !== slug){ projeto.slug = slug; projeto.dados = null; projeto.filtro = 'todos'; projeto.chave = ''; }
  const p = projetoAtual(slug);
  if (p) document.title = p.nome + ' | NeuroDynamics';
  ligarProducao();
  if (slug === '-' || (projeto.dados && projeto.slug === slug)) return;
  projetoCarregar(slug, vez);
}

async function projetoCarregar(slug, vez){
  if (!sb){ if (!projetoAtual(slug)) projetoSemDados(vez); return; }
  try{
    const { data, error } = await sb.rpc('site_projeto_publico', { p_slug:slug });
    if (vez !== projeto.vez || slug !== rotaProjeto()) return;
    if (error) throw error;
    if (data?.status === 'nao_encontrado'){
      projeto.dados = null;
      const el = $('#pj-pg');
      if (el) el.outerHTML = `<div class="pj-pg" id="pj-pg"><a class="pj-voltar" href="#/projects">${IC.arrow} ${esc(T().pj.voltar)}</a>
        <p class="pj-msg">${esc(T().pj.naoAchou)}</p></div>`;
      return;
    }
    if (data?.status !== 'ok') throw new Error('resposta');
    projeto.dados = { ...data.projeto, numeros:data.numeros || [], saidas:data.saidas || [] };
    projetoPintar();
  }catch(_){
    /* sem banco: a reserva (ou o que a lista trouxe) fica na tela */
    if (vez !== projeto.vez) return;
    const reserva = FALLBACK_PROJECTS.find(p => p.slug === slug);
    if (reserva){ projeto.dados = reserva; projetoPintar(); }
    else projetoSemDados(vez);
  }
}
function projetoSemDados(vez){
  if (vez !== projeto.vez) return;
  const m = $('#pj-msg'); if (m) m.textContent = T().pj.naoAchou;
}

/* repinta o que mudou; a animação só se o projeto trocou de animação */
function projetoPintar(){
  const slug = rotaProjeto(), p = projetoAtual(slug);
  const pg = $('#pj-pg'); if (!pg) return;
  if (!p || !$('#pj-topo')){ render('projects'); return; }
  const chave = JSON.stringify([state.lang, p, state.projects.map(x => [x.slug, x.nome, x.tagline, x.animacao, x.imagem_url])]);
  if (chave === projeto.chave) return;
  projeto.chave = chave;
  pg.className = 'pj-pg ' + fam(p);
  document.title = p.nome + ' | NeuroDynamics';
  $('#pj-topo').innerHTML = projetoTopo(p);
  const tela = $('#pj-palco .pj-tela');
  if ((tela?.dataset.anim || '') !== (temAnim(p) ? p.animacao : '')) $('#pj-palco').innerHTML = projetoPalco(p);
  secN = 0;
  $('#pj-corpo').innerHTML = projetoCorpo(p);
  ligarProducao();
  observe();
}

function ligarProducao(){
  document.querySelectorAll('.pj-chips button').forEach(b => b.addEventListener('click', () => {
    projeto.filtro = b.dataset.f;

    const el = $('#pj-saidas'); if (!el || !p) return;
    el.innerHTML = producaoLista(p.saidas || []);

/* a animação diz a própria altura (no celular a legenda fica embaixo) */
window.addEventListener('message', e => {
  if (e.origin !== location.origin && location.origin !== 'null') return;
  if (!e.data || e.data.nd !== 'anim' || !(e.data.h > 0)) return;
  document.querySelectorAll('iframe.anim').forEach(f => {
    if (f.contentWindow !== e.source) return;
    f.parentElement.style.setProperty('--alt', Math.ceil(e.data.h) + 'px');
    f.parentElement.classList.add('medida');
  });
});

/* o hash inteiro: lista, matéria ou confirmação da newsletter */
function newsRota(){
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [cam, q = ''] = h.split('?');
  const seg = cam.split('/');
  if (seg[0] === 'news') return seg[1] !== undefined && seg[1] !== '' ? { tipo:'materia', slug:seg[1] } : { tipo:'lista' };
  if (seg[0] === 'newsletter') return { tipo:'confirmar', token:new URLSearchParams(q).get('t') || '' };
  return { tipo:'' };
}
const imgPublica = u => typeof u === 'string' && /^noticias\//.test(u)
  ? CONFIG.SUPABASE_URL + '/storage/v1/object/public/' + u.split('/').map(encodeURIComponent).join('/') : '';
const dataLonga = d => d ? new Date(d).toLocaleDateString(T().htmlLang, { day:'numeric', month:'long', year:'numeric' }) : '';
const tagTipo = tp => `<span class="news-tag">${esc(tp === 'noticia' ? T().news.noticia : T().news.topico)}</span>`;
const tagPt = () => T().news.pt ? `<span class="news-tag">${esc(T().news.pt)}</span>` : '';

/* o pouco de formatação que o editor do SOMA aceita, sem nada de HTML de fora */
function mdSeguro(texto){
  const inline = x => x
    .replace(/\[([^\]\n]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)/g, (m, t, u) => /^https?:\/\//i.test(u.replace(/&amp;/g, '&'))
      ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  return esc(String(texto || '').replace(/\r/g, '')).split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => {
    const linhas = b.split('\n');
    if (linhas.every(l => /^- /.test(l))) return '<ul>' + linhas.map(l => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>';
    return '<p>' + linhas.map(inline).join('<br>') + '</p>';
  }).join('');
}

/* reações: só leitura no site; reagir é na página do SOMA */
function reacoesSo(r){
  return EMOJIS.filter(e => r && r[e] > 0).map(e => `<span class="reacao">${e} <span class="n">${Number(r[e])}</span></span>`).join('');
}
function reacoesBloco(it){
  if (it.tipo !== 'noticia' || !it.slug) return '';
  return `<div class="reacoes" aria-label="${esc(T().news.reagir)}">${reacoesSo(it.reacoes)}
    <a class="reacao" href="${PORTAL_URL}/noticia.html?n=${encodeURIComponent(it.slug)}">${esc(T().news.reagir)}</a></div>`;
}

function newsItem(it){
  const t = T().news, img = imgPublica(it.imagem), link = it.tipo === 'noticia' && SLUG_OK.test(it.slug || '');
  return `<article class="news-it">
    ${img ? `${link ? `<a href="#/news/${it.slug}" tabindex="-1" aria-hidden="true">` : ''}<img class="img" src="${esc(img)}" alt="${esc(it.titulo)}" loading="lazy">${link ? '</a>' : ''}` : ''}
    <div class="bd">
      <div class="news-meta">${tagTipo(it.tipo)}<span>${esc(dataLonga(it.publicado_em))}</span>${tagPt()}</div>
      <h2>${link ? `<a href="#/news/${it.slug}">${esc(it.titulo)}</a>` : esc(it.titulo)}</h2>
      ${it.resumo ? `<p class="news-sub">${esc(it.resumo)}</p>` : ''}
      ${it.tipo === 'topico' && it.texto ? `<div class="news-txt">${mdSeguro(it.texto)}</div>` : ''}
      ${link ? `<a class="news-ler" href="#/news/${it.slug}">${esc(t.ler)} <span class="ar">${IC.arrow}</span></a>` : ''}
      ${reacoesBloco(it)}
    </div>
  </article>`;
}

function nlBloco(){
  const t = T().nl;
  return `<div class="nl" id="nl">
    <div><span class="eyebrow">${esc(t.h)}</span><h2>${esc(t.h)}</h2><p class="lead">${esc(t.lead)}</p></div>
    <form id="nl-form" novalidate onsubmit="nlEnviar(event)">
      <label class="campo" for="nl-nome">${esc(t.nome)}
        <input type="text" id="nl-nome" name="nome" autocomplete="name" maxlength="120">
        <span class="erro" id="nl-e-nome" hidden></span></label>
      <label class="campo" for="nl-email">${esc(t.email)}
        <input type="email" id="nl-email" name="email" autocomplete="email" maxlength="200">
        <span class="erro" id="nl-e-email" hidden></span></label>
      <label class="aceite"><input type="checkbox" id="nl-aceite"> <span>${esc(t.consent)}</span></label>
      <span class="erro" id="nl-e-aceite" hidden></span>
      <div><button class="btn solid" type="submit" id="nl-btn">${esc(t.enviar)}</button></div>
      <span class="erro" id="nl-e-geral" hidden role="alert"></span>
    </form>
  </div>`;
}
function nlErro(onde, msg){
  for (const k of ['nome','email','aceite','geral']){ const e = $('#nl-e-' + k); if (e){ e.hidden = k !== onde; e.textContent = k === onde ? msg : ''; } }
  const campo = { nome:'#nl-nome', email:'#nl-email', aceite:'#nl-aceite' }[onde];
  document.querySelectorAll('#nl-form input').forEach(i => i.removeAttribute('aria-invalid'));
  if (campo) $(campo).setAttribute('aria-invalid', 'true');
}
async function nlEnviar(ev){
  ev.preventDefault();
  const t = T().nl, nome = $('#nl-nome').value.trim(), email = $('#nl-email').value.trim();
  if (!$('#nl-aceite').checked) return nlErro('aceite', t.consentimento);
  const bt = $('#nl-btn'); bt.disabled = true; nlErro('', '');
  try{
    if (!sb) throw new Error('sem cliente');
    const { data, error } = await sb.rpc('comunidade_inscrever', { p_email:email, p_nome:nome, p_consentimento:true });
    if (error) throw error;
    const st = data && data.status;
    if (st === 'ok'){ $('#nl-form').outerHTML = `<p class="ok" role="status">${esc(t.ok)}</p>`; return; }
    const onde = { email_invalido:'email', nome_invalido:'nome', consentimento:'aceite' }[st] || 'geral';
    nlErro(onde, t[st] || t.erro);
  }catch(_){ nlErro('geral', t.erro); }
  finally{ if (document.body.contains(bt)) bt.disabled = false; }
}

function pageNews(){
  const r = newsRota(), t = T().news;
  if (r.tipo === 'materia') return `<div class="pg-head news-art" id="news-art"><p class="news-msg">…</p></div>`;
  return `
  <div class="pg-head">
    <span class="eyebrow">${esc(t.eyebrow)}</span>
    <h1>${esc(t.h1)}</h1>
    <p class="lead">${esc(t.lead)}</p>
  </div>
  <section>
    <div id="news-lista" aria-busy="true"><p class="news-msg">…</p></div>
    <div class="news-mais" id="news-mais" hidden><button class="btn ghost" type="button" onclick="newsMais()">${esc(t.mais)}</button></div>
    ${nlBloco()}
  </section>`;
}

/* chamado depois do render: a vez descarta resposta de página que já saiu */
function newsInit(){
  const r = newsRota(), vez = ++news.vez;
  if (r.tipo === 'materia') return materiaCarregar(r.slug, vez);
  news.itens = []; news.fim = false;
  newsCarregar(vez, true);
}
async function newsCarregar(vez, primeira){
  const el = $('#news-lista'), t = T().news; if (!el) return;
  const bt = $('#news-mais button'); if (bt) bt.disabled = true;
  try{
    if (!sb) throw new Error('sem cliente');
    const ult = news.itens[news.itens.length - 1];
    const { data, error } = await sb.rpc('noticias_publicas', ult ? { p_antes:ult.publicado_em, p_limite:12 } : { p_limite:12 });
    if (error) throw error;
    if (vez !== news.vez || !el.isConnected) return;
    const itens = Array.isArray(data) ? data : [];
    news.itens.push(...itens); news.fim = itens.length < 12;
    if (primeira) el.innerHTML = news.itens.length ? '<div class="news-grid" id="news-grid"></div>' : `<p class="news-msg">${esc(t.vazio)}</p>`;
    const g = $('#news-grid'); if (g) g.insertAdjacentHTML('beforeend', itens.map(newsItem).join(''));
    $('#news-mais').hidden = news.fim;
  }catch(_){
    if (vez !== news.vez || !el.isConnected) return;
    if (primeira) el.innerHTML = `<p class="news-msg">${esc(t.erro)}</p><button class="btn ghost" type="button" onclick="newsInit()">${esc(t.tentar)}</button>`;
    else toast(t.erro);
  }finally{ el.removeAttribute('aria-busy'); if (bt) bt.disabled = false; }
}
function newsMais(){ newsCarregar(news.vez, false); }

async function materiaCarregar(slug, vez){
  const el = $('#news-art'), t = T().news; if (!el) return;
  const volta = `<a class="voltar" href="#/news">← ${esc(t.voltar)}</a>`;
  if (!SLUG_OK.test(slug)){ el.innerHTML = `${volta}<p class="news-msg">${esc(t.naoAchou)}</p>`; return; }
  try{
    if (!sb) throw new Error('sem cliente');
    const { data:n, error } = await sb.rpc('noticia_publica', { p_slug:slug });
    if (error) throw error;
    if (vez !== news.vez || !el.isConnected) return;
    if (!n || n.status !== 'ok'){ el.innerHTML = `${volta}<p class="news-msg">${esc(t.naoAchou)}</p>`; return; }
    if (n.redirecionar && SLUG_OK.test(n.slug || '')) history.replaceState(null, '', location.pathname + location.search + '#/news/' + n.slug);
    document.title = (n.titulo || '') + ' | NeuroDynamics';
    const figs = (n.imagens || []).map(i => ({ src:imgPublica(i.url), leg:i.legenda })).filter(i => i.src)
      .map(i => `<figure><img src="${esc(i.src)}" alt="${esc(i.leg || n.titulo)}" loading="lazy">${i.leg ? `<figcaption>${esc(i.leg)}</figcaption>` : ''}</figure>`).join('');
    el.innerHTML = `${volta}
      <article>
        <div class="news-meta">${tagTipo(n.tipo)}<span>${esc(dataLonga(n.publicado_em))}</span>${n.autor ? `<span>${esc(t.texto.replace('{a}', n.autor))}</span>` : ''}${tagPt()}</div>
        <h1>${esc(n.titulo)}</h1>
        ${n.subtitulo ? `<p class="lead">${esc(n.subtitulo)}</p>` : ''}
        ${figs}
        <div class="news-txt">${mdSeguro(n.texto)}</div>
        <div class="rodape">
          ${reacoesBloco(n)}
          <p class="dica">${esc(t.reagirDica)}</p>
          <div class="acts"><button class="btn ghost" type="button" onclick="materiaCopiar()">${IC.copy ? `<span class="ar">${IC.copy}</span>` : ''}${esc(t.copiar)}</button></div>
        </div>
      </article>`;
    news.slug = n.slug;
  }catch(_){
    if (vez !== news.vez || !el.isConnected) return;
    el.innerHTML = `${volta}<p class="news-msg">${esc(t.erro)}</p><button class="btn ghost" type="button" onclick="newsInit()">${esc(t.tentar)}</button>`;
  }
}
function materiaCopiar(){
  const u = SITE_URL + '/#/news/' + (news.slug || '');
  navigator.clipboard?.writeText(u).then(() => toast(T().news.copiado)).catch(() => toast(u));
}

/* #/newsletter/confirmar?t=<token> */
function pageNewsletterConfirm(){
  return `<div class="pg-head nl-conf"><span class="eyebrow">${esc(T().nl.h)}</span><h1>${esc(T().nl.h)}</h1>
    <div id="nl-conf"><p>${esc(T().nl.confirmando)}</p></div></div>`;
}
async function confirmarInit(){
  const r = newsRota(), el = $('#nl-conf'), t = T().nl, vez = ++news.vez; if (!el) return;
  const fim = (msg, ok) => { el.innerHTML = `<p role="status">${esc(msg)}</p><a class="btn ghost" href="#/news">${esc(ok ? T().news.voltar : t.h)}</a>`; };
  if (r.tipo !== 'confirmar' || !UUID_OK.test(r.token)) return fim(t.invalido, false);
  try{
    if (!sb) throw new Error('sem cliente');
    const { data, error } = await sb.rpc('comunidade_confirmar', { p_token:r.token });
    if (error) throw error;
    if (vez !== news.vez || !el.isConnected) return;
    data && data.status === 'ok' ? fim(t.confirmado, true) : fim(t.invalido, false);
  }catch(_){ if (vez === news.vez && el.isConnected) fim(t.erro, false); }
}

/* início: as três mais recentes; sem notícia ou com erro, a seção some */
async function homeNews(){
  const el = $('#home-news'), vez = news.vez; if (!el || !sb) return;
  try{
    const { data, error } = await sb.rpc('noticias_publicas', { p_limite:3 });
    if (error || !Array.isArray(data) || !data.length || vez !== news.vez || !el.isConnected) return;
    const t = T().news;
    el.innerHTML = `<div class="sec-head"><span class="eyebrow">${esc(t.home)}</span>
        <div><h2>${esc(t.home)}</h2></div></div>
      <div class="home-news">${data.map(it => {
        const link = it.tipo === 'noticia' && SLUG_OK.test(it.slug || '') ? '#/news/' + it.slug : '#/news';
        return `<a href="${link}"><div class="news-meta">${tagTipo(it.tipo)}<span>${esc(dataLonga(it.publicado_em))}</span></div><h3>${esc(it.titulo)}</h3></a>`; }).join('')}</div>
      <div class="pgrid-foot"><a class="btn ghost" href="#/news">${esc(t.todas)} <span class="ar">${IC.arrow}</span></a></div>`;
    el.hidden = false;
  }catch(_){}
}

/* ---------------- router ---------------- */
const PAGES = { home:pageHome, about:pageAbout, projects:pageProjects, contact:pageContact,
                news:pageNews, newsletter:pageNewsletterConfirm };
function route(){
  const h = (location.hash || '#/').replace(/^#\//,'').split(/[/?]/)[0];
  return PAGES[h] ? h : 'home';
}
/* y: onde a página abre (null mantém a rolagem, como na troca de idioma) */
function render(r, y = null){
  const t = T();
  pressDestroy();                       // the old page's player goes with its markup
  secN = 0;                             // section numbering restarts on every page
  document.documentElement.lang = t.htmlLang;
  document.title = t.titles[r];
  $('#meta-desc').setAttribute('content', t.desc);
  $('#main').innerHTML = PAGES[r]();
  if (y !== null) window.scrollTo({ top:y, behavior:'instant' });
  document.querySelectorAll('[data-r]').forEach(a =>
    a.classList.toggle('on', a.dataset.r === r));
  NDCasca.marcar(r);
  NDCasca.menu(false);
  observe();
  if (r === 'home'){ trilhosInit(); news.vez++; homeNews(); }
  if (r === 'about') pressInit();
  if (r === 'projects') rotaProjeto() ? projetoInit() : indiceInit();
  if (r === 'news') newsInit();
  if (r === 'newsletter') confirmarInit();
}

/* ---------------- navegar ----------------
   A troca de página é uma View Transition: o cabeçalho fica, a página
   esmaece e a nova sobe (0,15 a 0,25 s, como manda o guia). Do
   cartão de um projeto para a página dele, o pôster cresce até virar o
   palco (pj-midia), e na volta encolhe para o cartão de onde saiu. Sem
   suporte, ou com movimento reduzido, a página só troca.
   A rolagem de cada entrada do histórico fica no history.state: voltar
   abre onde se estava; um link novo abre no topo. */
const reduzido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let slugAnterior = '';
function navegar(){
  const r = route(), y = history.state?.y || 0, de = slugAnterior;
  slugAnterior = r === 'projects' ? rotaProjeto() : '';
  const troca = () => {
    render(r, y);
    if (de && !slugAnterior) $(`[data-slug="${CSS.escape(de)}"] .pj-img`)?.style.setProperty('view-transition-name', 'pj-midia');
  };
  if (!document.startViewTransition || reduzido() || document.hidden){ troca(); limparNomes(); return; }
  document.startViewTransition(troca).finished.finally(limparNomes);
}
function limparNomes(){
  document.querySelectorAll('.pj-img[style*="view-transition-name"]').forEach(e => e.style.removeProperty('view-transition-name'));
}
/* o cartão clicado leva o nome da transição antes de a página trocar */
document.addEventListener('click', e => {
  const a = e.target.closest?.('a[data-slug]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  limparNomes();
  a.querySelector('.pj-img')?.style.setProperty('view-transition-name', 'pj-midia');
});
window.addEventListener('hashchange', navegar);
try{ history.scrollRestoration = 'manual'; }catch(_){}
let rolT;
window.addEventListener('scroll', () => {
  clearTimeout(rolT);
  rolT = setTimeout(() => { try{ history.replaceState({ ...(history.state || {}), y:Math.round(scrollY) }, ''); }catch(_){} }, 160);
}, { passive:true });

/* ---------------- language ---------------- */
/* labels that live outside <main> and the selector itself */
function paintChrome(){
  const t = T(), r = route();
  NDCasca.montar({
    site:'site', lang:state.lang, idiomas:LANGS, inicio:'#/', email:CONTACT_EMAIL,
    links:['home','about','projects','news','contact'].map(k =>
      ({ href: k === 'home' ? '#/' : '#/' + k, rotulo:t.nav[k], chave:k, atual:k === r })),
    cta:{ href:'#/contact', rotulo:t.cta },
    desc:t.ft.desc,
    aoIdioma:setLang
  });
}

function setLang(l){
  if (!LANGS.includes(l) || l === state.lang) return;
  state.lang = l;
  try{ localStorage.setItem('nd-lang', l); }catch(_){}
  paintChrome();
  render(route());
}

/* ---------------- scroll effects ---------------- */
let obs;
/* o que já está na tela quando a página abre aparece de uma vez (a
   transição da página cuida disso); o resto entra ao rolar */
function observe(){
  obs?.disconnect();
  obs = new IntersectionObserver(es => es.forEach(e=>{
    if (e.isIntersecting){ e.target.classList.add('viu'); obs.unobserve(e.target); }
  }), { threshold:.12 });
  const h = innerHeight;
  document.querySelectorAll('.reveal:not(.viu)').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.top < h && r.bottom > 0) el.classList.add('viu', 'ja');
    else obs.observe(el);
  });
}

/* ---------------- boot ---------------- */
paintChrome();
slugAnterior = route() === 'projects' ? rotaProjeto() : '';
render(route(), history.state?.y || 0);
loadProjects();
loadPress();
</script>
