<!--
  NeuroDynamics, animação do Équio (tDCS e GVS num eletroestimulador que já
  existe), a partir da cena de referência (calima.html): o mesmo modelo e a
  mesma pele, em close. Primeiro a tDCS (eletrodos na testa e no alto da
  cabeça, corrente contínua em rampa), depois a GVS (atrás das orelhas). A
  corrente aparece em raio X; o painel mostra a forma de onda. Ilustrativo:
  só o 2 mA vem do projeto.
  Parâmetros: lang=en|pt|fr, t=<s> (congela), poster=1, phi, d.
-->

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const TEXT = {
  pt: {
    note: 'Simulação ilustrativa. Projeto pronto para iniciar.',
    pause: 'Pausar a animação', play: 'Reproduzir a animação', detail: 'Detalhe',
    hud: { corrente: 'Corrente', imp: 'Impedância medida', ate: 'até 2 mA' },
    tags: {
      tdcs: ['tDCS', 'Dois eletrodos sobre a cabeça. Uma corrente contínua e fraca modula a atividade do córtex.'],
      gvs: ['GVS', 'Eletrodos atrás das orelhas estimulam o sistema do equilíbrio.'],
      onda: ['Corrente controlada', 'Sobe em rampa, fica estável e desce em rampa. A impedância é medida o tempo todo.'],
    },
  },
  en: {
    note: 'Illustrative simulation. Project ready to start.',
    pause: 'Pause the animation', play: 'Play the animation', detail: 'Detail',
    hud: { corrente: 'Current', imp: 'Impedance monitored', ate: 'up to 2 mA' },
    tags: {
      tdcs: ['tDCS', 'Two electrodes on the head. A weak direct current modulates cortical activity.'],
      gvs: ['GVS', 'Electrodes behind the ears stimulate the balance system.'],
      onda: ['Controlled current', 'It ramps up, holds steady and ramps down. Impedance is measured throughout.'],
    },
  },
  fr: {
    note: 'Simulation illustrative. Projet prêt à démarrer.',
    pause: 'Mettre l\'animation en pause', play: 'Lire l\'animation', detail: 'Détail',
    hud: { corrente: 'Courant', imp: 'Impédance surveillée', ate: 'jusqu\'à 2 mA' },
    tags: {
      tdcs: ['tDCS', 'Deux électrodes sur la tête. Un faible courant continu module l\'activité du cortex.'],
      gvs: ['GVS', 'Des électrodes derrière les oreilles stimulent le système de l\'équilibre.'],
      onda: ['Courant contrôlé', 'Il monte en rampe, reste stable et redescend en rampe. L\'impédance est mesurée en continu.'],
    },
  },
};

const $ = (id) => document.getElementById(id);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const params = new URLSearchParams(location.search);
const stage = $('stage');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lang = NDAnim.lang;
let playing = !reduced;

// ---------- renderer & scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
// At least 1.5x even on 1x screens: the browser scales the canvas down, which
// smooths edges. Capped at 1.75 for phones.
renderer.setPixelRatio(Math.min(Math.max(devicePixelRatio, 1.5), 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050807);
scene.fog = new THREE.Fog(0x050807, 4.5, 9);
const camera = new THREE.PerspectiveCamera(30, 16 / 9, 0.05, 40);
const target = V(0, 1.6, 0);

scene.add(new THREE.HemisphereLight(0xe6ecea, 0x0b1210, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(2.2, 4.2, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.6, right: 1.6, top: 1.6, bottom: -1.6, near: 0.5, far: 12 });
key.shadow.bias = -0.0003;
key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight(0xb9c7d6, 0.55);
fill.position.set(-3, 1.2, 1.5);
scene.add(fill);
const back = new THREE.DirectionalLight(0xffffff, 0.8);
back.position.set(-1.5, 2.2, -3.5);
scene.add(back);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.45 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(8, 32, 0x9aa5a1, 0x9aa5a1);
grid.material.transparent = true;
grid.material.opacity = 0.05;
grid.position.y = 0.001;
scene.add(grid);

// ---------- materials ----------
const clay = new THREE.MeshStandardMaterial({ color: 0xc6cdcb, roughness: 0.82, metalness: 0 });
// The working muscle lights the skin of the thigh: the front face for the
// quadriceps, the back face for the hamstrings. Each thigh is described by its
// hip-to-knee axis and the direction its front faces, so clothing thickness
// doesn't matter.
const muscleGlow = {
  uAxis: { value: Array.from({ length: 4 }, () => new THREE.Vector3(0, -9, 0)) },
  uQuadDir: { value: [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0)] },
  uHamDir: { value: [new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, -1, 0)] },
  uAct: { value: [0, 0, 0, 0] },
  uLime: { value: new THREE.Color(0xcedc00) },
  uLogo: { value: new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1) },
  uIcon: { value: new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1) },
  // Electrodes are painted onto the skin, like a sticker: centre, thigh axis and
  // outward normal of each pad, all in the body's rest (bind) space.
  uPadC: { value: Array.from({ length: 8 }, () => new THREE.Vector3(0, -9, 0)) },
  uPadU: { value: Array.from({ length: 8 }, () => new THREE.Vector3(0, 1, 0)) },
  uPadN: { value: Array.from({ length: 8 }, () => new THREE.Vector3(0, 0, 1)) },
  // Head bone in the same rest space: the EEG band and pads are painted relative to it.
  uHead: { value: new THREE.Vector3(0, -9, 0) },
  uHPD: { value: Array.from({ length: 4 }, () => new THREE.Vector3(0, -1, 0)) },
  uHPS: { value: Array.from({ length: 4 }, () => new THREE.Vector2(0.2, 0.25)) },
  uHPA: { value: [0, 0, 0, 0] },
};
muscleGlow.uLogo.value.needsUpdate = true;
new THREE.TextureLoader().load('modelo/logo-camisa.png', (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  muscleGlow.uLogo.value = tex;
});
new THREE.TextureLoader().load('modelo/simbolo-manga.png', (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  muscleGlow.uIcon.value = tex;
});
clay.defines = params.has('wp') ? { DEBUG_WP: '' } : {};
if (!params.has('nude')) clay.defines.CLOTHES = '';
const EEG = params.has('eeg');
if (EEG) clay.defines.EEG = '';
clay.onBeforeCompile = (shader) => {
  Object.assign(shader.uniforms, muscleGlow);
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWorldPos;
      varying vec3 vBind;`)
    .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
      vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vBind = position;`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWorldPos;
      varying vec3 vBind;
      uniform vec3 uAxis[4];
      uniform vec3 uQuadDir[2];
      uniform vec3 uHamDir[2];
      uniform float uAct[4];
      uniform vec3 uLime;
      uniform sampler2D uLogo;
      uniform sampler2D uIcon;
      uniform vec3 uPadC[8];
      uniform vec3 uPadU[8];
      uniform vec3 uPadN[8];
      uniform vec3 uHead;
      uniform vec3 uHPD[4];
      uniform vec2 uHPS[4];
      uniform float uHPA[4];
      float thighGlow(vec3 p, vec3 a, vec3 k, vec3 quadDir, vec3 hamDir, float side, float q, float h) {
        vec3 ba = k - a;
        float t = clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
        vec3 radial = p - (a + ba * t);
        float along = smoothstep(0.38, 0.52, t) * (1.0 - smoothstep(0.84, 0.95, t));
        float near = 1.0 - smoothstep(0.11, 0.16, length(radial));
        float ownSide = step(0.0, p.x * side);
        vec3 dir = normalize(radial);
        return along * near * ownSide * (q * smoothstep(0.2, 0.7, dot(dir, quadDir)) + h * smoothstep(0.2, 0.7, dot(dir, hamDir)));
      }`)
    .replace('#include <color_fragment>', `#include <color_fragment>
      // Clothing painted onto the standing (bind) pose so it moves with the
      // body: shorts to mid-thigh and a short-sleeved shirt, a shade darker.
      #ifdef CLOTHES
      float ax = abs(vBind.x);
      float shorts = step(0.74, vBind.y) * step(vBind.y, 1.04) * step(ax, 0.3);
      float shirt = max(step(1.0, vBind.y) * step(vBind.y, 1.52) * step(ax, 0.215),
                        step(1.33, vBind.y) * step(vBind.y, 1.57) * step(0.17, ax) * step(ax, 0.4));
      // Hems: a thin darker band where each garment ends, so it reads as cloth.
      float hem = shorts * (1.0 - smoothstep(0.0, 0.012, vBind.y - 0.74))
                + max(shirt - shorts, 0.0) * (1.0 - smoothstep(0.0, 0.012, 1.52 - vBind.y) * step(ax, 0.215))
                + step(1.33, vBind.y) * step(vBind.y, 1.57) * (1.0 - smoothstep(0.0, 0.012, 0.4 - ax)) * step(0.17, ax);
      float shirtOnly = max(shirt - shorts, 0.0);
      // The team's black shirt; shorts a shade lighter so the two garments read apart.
      diffuseColor.rgb *= (1.0 - 0.55 * shorts) * (1.0 - 0.78 * shirtOnly) * (1.0 - 0.35 * clamp(hem, 0.0, 1.0));
      // NeuroDynamics wordmark across the chest, projected from the front.
      vec2 luv = vec2((vBind.x + 0.1025) / 0.205, (vBind.y - 1.318) / 0.035);
      float inLogo = step(0.0, luv.x) * step(luv.x, 1.0) * step(0.0, luv.y) * step(luv.y, 1.0) * step(0.03, vBind.z) * shirtOnly;
      vec4 logoTex = texture2D(uLogo, clamp(luv, 0.0, 1.0));
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92), inLogo * logoTex.a * logoTex.r);
      // The NeuroDynamics symbol (no wordmark) on the outer side of each
      // sleeve. Measured on the rest pose: shoulder joint (0.212, 1.455,
      // -0.065) to elbow (0.463, 1.455, -0.073); the face that points up in
      // the T-pose is the outer side once the arm hangs.
      for (int k = 0; k < 2; k++) {
        float sd = k == 0 ? 1.0 : -1.0;
        vec3 sa = vec3(0.212 * sd, 1.455, -0.065), sb = vec3(0.463 * sd, 1.455, -0.073);
        vec3 ab = sb - sa;
        float st = dot(vBind - sa, ab) / dot(ab, ab);
        vec3 sr = vBind - (sa + ab * st);
        float ang = atan(sr.z, sr.y);                      // 0 on the outer side
        // Upright when the arm hangs: the top of the symbol points to the
        // shoulder and it reads from outside the arm, not mirrored. 5 cm tall
        // along the arm (st 0.25-0.45 of 0.251 m) and 1.8 rad around it: tuned
        // on renders of the hanging arm until it kept the icon's 512:456 look.
        vec2 suv = vec2(0.5 - sd * ang / 1.8, (0.45 - st) / 0.2);
        float inS = step(0.0, suv.x) * step(suv.x, 1.0) * step(0.0, suv.y) * step(suv.y, 1.0) * step(0.0, sr.y) * shirtOnly;
        vec4 ic = texture2D(uIcon, clamp(suv, 0.0, 1.0));
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92), inS * ic.a);
      }
      #endif
      float glow = thighGlow(vWorldPos, uAxis[0], uAxis[1], uQuadDir[0], uHamDir[0], 1.0, uAct[0], uAct[1])
                 + thighGlow(vWorldPos, uAxis[2], uAxis[3], uQuadDir[1], uHamDir[1], -1.0, uAct[2], uAct[3]);
      glow = clamp(glow, 0.0, 1.0);
      #ifdef DEBUG_WP
      glow = step(0.6, vWorldPos.y);
      #endif
      // Tint the skin itself, so the glow survives on the brightly lit side too.
      diffuseColor.rgb = mix(diffuseColor.rgb, uLime * 0.85, glow * 0.8);
      // Electrodes: a 5 x 7.5 cm rounded pad with a white snap, one pair per
      // muscle, joined by a short lead. Painted in rest space, so they bend
      // with the skin and can never sink into it or float above it.
      float pad = 0.0, snap = 0.0, lead = 0.0;
      for (int i = 0; i < 8; i++) {
        vec3 d = vBind - uPadC[i];
        if (abs(dot(d, uPadN[i])) > 0.035) continue;
        vec3 w = normalize(cross(uPadU[i], uPadN[i]));
        vec2 q = vec2(dot(d, w), dot(d, uPadU[i]));
        vec2 e = abs(q) - vec2(0.017, 0.0295);
        float sd = length(max(e, 0.0)) + min(max(e.x, e.y), 0.0) - 0.008;
        pad = max(pad, 1.0 - smoothstep(-0.0012, 0.0012, sd));
        snap = max(snap, 1.0 - smoothstep(0.0072, 0.0088, length(q)));
      }
      for (int k = 0; k < 4; k++) {
        vec3 a = uPadC[k * 2], b = uPadC[k * 2 + 1];
        vec3 n = normalize(uPadN[k * 2] + uPadN[k * 2 + 1]);
        vec3 ba = b - a;
        vec3 d = vBind - (a + ba * clamp(dot(vBind - a, ba) / dot(ba, ba), 0.0, 1.0));
        float dn = dot(d, n);
        if (abs(dn) > 0.035) continue;
        lead = max(lead, 1.0 - smoothstep(0.0016, 0.0028, length(d - n * dn)));
      }
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.13, 0.15, 0.145), lead * (1.0 - pad));
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.05, 0.065, 0.06), pad);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.9, 0.92, 0.91), snap * pad);
      #ifdef EEG
      // EEG, as on the real setup: a black elastic band at the hairline that
      // dips toward the nape at the back, and two white square pads on the
      // forehead just below it, each with a dark snap. Offsets are measured on
      // this model: brows end ~14 cm above the head bone, the crown ~22.5 cm.
      vec3 hd = vBind - uHead;
      float bandC = 0.16 + 0.025 * clamp(hd.z / 0.09, -1.0, 1.0);
      float band = step(0.05, hd.y) * (1.0 - smoothstep(0.0085, 0.0105, abs(hd.y - bandC)));
      float epad = 0.0, esnap = 0.0;
      for (int i = 0; i < 2; i++) {
        vec2 q = vec2(hd.x - (i == 0 ? 0.026 : -0.026), hd.y - 0.162);
        vec2 e = abs(q) - vec2(0.0095);
        float sd = length(max(e, 0.0)) + min(max(e.x, e.y), 0.0) - 0.0045;
        float front = step(0.05, hd.z);
        epad = max(epad, front * (1.0 - smoothstep(-0.0008, 0.0008, sd)));
        esnap = max(esnap, front * (1.0 - smoothstep(0.0042, 0.0056, length(q))));
      }
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.06, 0.07, 0.068), band);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.93, 0.94, 0.94), epad);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.08, 0.09, 0.09), esnap * epad);
      #endif
      // tDCS and GVS electrodes: rounded sponges painted on the scalp,
      // around their direction from the skull centre (head-bone rest space).
      vec3 hrel = vBind - uHead - vec3(0.0, 0.13, 0.005);
      float headGlow = 0.0, sponge = 0.0, ring = 0.0;
      if (length(hrel) < 0.16) {
        vec3 hdir = normalize(hrel);
        for (int i = 0; i < 4; i++) {
          vec3 n = uHPD[i];
          if (dot(hdir, n) < 0.6) continue;
          vec3 u = normalize(cross(abs(n.y) > 0.9 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0), n));
          vec3 w = cross(n, u);
          vec2 q = vec2(dot(hdir, u), dot(hdir, w));
          vec2 e = abs(q) - uHPS[i];
          float sd = length(max(e, 0.0)) + min(max(e.x, e.y), 0.0) - 0.05;
          float inside = 1.0 - smoothstep(-0.006, 0.006, sd);
          sponge = max(sponge, inside);
          ring = max(ring, (1.0 - smoothstep(0.0, 0.05, abs(sd + 0.004))) * uHPA[i]);
          headGlow = max(headGlow, inside * uHPA[i]);
        }
      }
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.13, 0.15, 0.145), sponge);
      diffuseColor.rgb = mix(diffuseColor.rgb, uLime * 0.9, ring * 0.85);`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += uLime * glow * 0.35 * (1.0 - pad) + uLime * (headGlow * 0.12 + ring * 0.6);`);
};
const frameMat = new THREE.MeshStandardMaterial({ color: 0x55605c, roughness: 0.45, metalness: 0.6 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x161c1a, roughness: 0.85 });
const fabric = new THREE.MeshStandardMaterial({ color: 0x1a201e, roughness: 0.95 });
const shadowy = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
const tube = (points, r, mat = frameMat) => shadowy(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 48, r, 10, false), mat));

// ---------- rider ----------
const loader = new GLTFLoader();
const gltf = await loader.loadAsync('modelo/humano.glb').catch(() => null);
if (!gltf) { NDAnim.falhou(); throw new Error('model'); }
const model = gltf.scene;
model.traverse((o) => {
  if (o.isMesh) { o.material = clay; o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
});
scene.add(model);
// Works with Mixamo rigs and with Unreal-style rigs (pelvis, thigh_l, calf_l…).
const UE = {
  Hips: 'pelvis', Spine: 'spine_01', Spine1: 'spine_02', Spine2: 'spine_03', Neck: 'neck_01', Head: 'Head',
  LeftArm: 'upperarm_l', LeftForeArm: 'lowerarm_l', LeftHand: 'hand_l',
  RightArm: 'upperarm_r', RightForeArm: 'lowerarm_r', RightHand: 'hand_r',
  LeftUpLeg: 'thigh_l', LeftLeg: 'calf_l', LeftFoot: 'foot_l', LeftToeBase: 'ball_l',
  RightUpLeg: 'thigh_r', RightLeg: 'calf_r', RightFoot: 'foot_r', RightToeBase: 'ball_r',
};
let prefix = '';
let unreal = false;
model.traverse((o) => {
  if (o.isBone && /Hips$/.test(o.name)) prefix = o.name.replace(/Hips$/, '');
  if (o.isBone && o.name === 'pelvis') unreal = true;
});
const B = {};
for (const n of ['Hips', 'Spine', 'Spine1', 'Spine2', 'Neck', 'Head', 'HeadTop_End',
  'LeftArm', 'LeftForeArm', 'LeftHand', 'RightArm', 'RightForeArm', 'RightHand',
  'LeftUpLeg', 'LeftLeg', 'LeftFoot', 'LeftToeBase', 'RightUpLeg', 'RightLeg', 'RightFoot', 'RightToeBase']) {
  B[n] = model.getObjectByName(unreal ? UE[n] : prefix + n);
}
const rest = [];
model.traverse((o) => { if (o.isBone) rest.push([o, o.quaternion.clone()]); });
const wp = (o) => o.getWorldPosition(new THREE.Vector3());
const len = (a, b) => wp(a).distanceTo(wp(b));
// Standing, at the scale of the other scenes (a 0.889 m hip-to-ankle leg).
model.updateMatrixWorld(true);
model.scale.setScalar(0.889 / (len(B.LeftUpLeg, B.LeftLeg) + len(B.LeftLeg, B.LeftFoot)));
model.updateMatrixWorld(true);
model.position.copy(V(0, 0.95, 0).sub(wp(B.Hips)));
model.updateMatrixWorld(true);
const HIP = wp(B.LeftUpLeg);
if (params.has('measure')) {
  // Rest pose: where is the head bone relative to the forehead skin?
  const hb = wp(B.Head), nb = wp(B.Neck);
  let body = null;
  model.traverse((o) => { if (o.isSkinnedMesh && (!body || o.geometry.attributes.position.count > body.geometry.attributes.position.count)) body = o; });
  const pos = body.geometry.attributes.position, v = new THREE.Vector3();
  const rows = {};
  for (let k = 0; k < pos.count; k++) {
    v.fromBufferAttribute(pos, k); body.applyBoneTransform(k, v); v.applyMatrix4(body.matrixWorld);
    const dy = v.y - hb.y;
    if (dy < -0.05) continue;
    const key = (Math.round(dy * 50) / 50).toFixed(2);
    const r = rows[key] || (rows[key] = { zmin: 9, zmax: -9, xmax: -9 });
    r.zmin = Math.min(r.zmin, v.z - hb.z); r.zmax = Math.max(r.zmax, v.z - hb.z); r.xmax = Math.max(r.xmax, Math.abs(v.x - hb.x));
  }
  console.log('HEAD', JSON.stringify({ hb: hb.toArray().map((x) => +x.toFixed(3)), up: hb.clone().sub(nb).normalize().toArray().map((x) => +x.toFixed(2)) }));

const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _q = new THREE.Quaternion(), _qw = new THREE.Quaternion(), _qp = new THREE.Quaternion();

function ik(root, mid, end, T, pole, L1, L2) {

  const d = Math.min(Math.max(dv.length(), 0.05), L1 + L2 - 1e-3);
  const u = dv.normalize();

// Standing still, arms down, head level: only the camera and the current move.
function pose() {

  model.updateMatrixWorld(true);
  aim(B.Neck, B.Head, V(0, 1, 0.04));
  if (B.HeadTop_End) aim(B.Head, B.HeadTop_End, V(0, 1, 0.05));
  for (const [s, sx] of [['Left', 1], ['Right', -1]]) {
    aim(B[s + 'Arm'], B[s + 'ForeArm'], V(sx * 0.18, -1, 0.02));

}

// ---------- the electrodes and the current ----------
let bodyMesh = null;

const SKULL_C = V(0, 0.13, 0.005);
// Directions from the skull centre (rest space; the model's left is +x):
// anode over the left frontal cortex, cathode over the right eyebrow, and the
// two mastoids behind the ears. Sizes are half-widths in radians.
const ELETRODOS = [
  { dir: V(0.5, 0.78, 0.38), size: [0.2, 0.26] },     // tDCS anode
  { dir: V(-0.42, 0.3, 0.86), size: [0.24, 0.13] },   // tDCS cathode
  { dir: V(0.8, -0.36, -0.42), size: [0.12, 0.15] },  // GVS left mastoid
  { dir: V(-0.8, -0.36, -0.42), size: [0.12, 0.15] }, // GVS right mastoid

  e.dir.normalize();

  const p = new THREE.Vector3();

  for (let k = 0; k < bodyPos.count; k++) {
    p.fromBufferAttribute(bodyPos, k).sub(headBind).sub(SKULL_C);

// The current: a bundle of curves through the head, drawn over it (x-ray),

const FEIXES = 9, PONTOS = 5;
function feixe(a, b, fundo) {
  return Array.from({ length: FEIXES }, (_, i) => {
    const k = i / (FEIXES - 1), lado = (k - 0.5) * 0.09;
    const ab = b.clone().sub(a), meio = a.clone().lerp(b, 0.5);
    const dentro = skull.clone().sub(meio).normalize();
    const lat = new THREE.Vector3().crossVectors(ab, dentro).normalize();

      depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending }));

}

// ---------- the cycle: tDCS, then GVS ----------
// tDCS: ramp up, plateau, ramp down (a direct current). GVS: an alternating
// current. Only the shapes are drawn; the 2 mA is the project's ceiling.
const PERIOD = 16, METADE = 8;
const smooth = (v) => { v = Math.min(1, Math.max(0, v)); return v * v * (3 - 2 * v); };
const rampa = (c, a, b) => smooth((c - a) / (b - a));

function update(time) {
  const c = time % PERIOD, it = iTdcs(c), ig = iGvs(c), ag = Math.abs(ig);
  muscleGlow.uHPA.value[0] = muscleGlow.uHPA.value[1] = it;
  muscleGlow.uHPA.value[2] = muscleGlow.uHPA.value[3] = ag;
  for (const [lista, nivel, nuvemP, mexe] of [[TDCS, it, pontosT, (f) => (f + time * 0.18) % 1],
                                               [GVS, ag, pontosG, (f) => (f + Math.sin((time % PERIOD - METADE) * Math.PI * 1.1) * 0.08 + 1) % 1]]) {
    const pos = nuvemP.geometry.attributes.position;

// ---------- camera: nearly still, a slow breath in and out ----------

let zoomRect = null;
let revealStart = null;
const CHARS_PER_SEC = 34, GAP = 0.9;

function drawTags() {
  const T = TEXT[lang];
  const w = stage.clientWidth, h = stage.clientHeight;
  const narrow = w < 760;
  const since = revealStart === null ? -1 : (performance.now() - revealStart) / 1000;
  let offset = 0;
  TAGS.forEach((tg, i) => {
    const [title, sub] = T.tags[tg.key];
    // Each title types itself after the previous label is complete; its body
    // then fades in whole, since typing 120 characters would take too long.
    const n = reduced ? title.length : Math.max(0, Math.min(title.length, Math.floor((since - offset) * CHARS_PER_SEC)));
    offset += title.length / CHARS_PER_SEC + GAP;
    if (n !== tg.shown || tg.lang !== lang) {
      tg.el.firstChild.innerHTML = n > 0 ? `<i>${tg.num}</i>` : '';
      tg.el.firstChild.append(title.slice(0, n));
      tg.el.querySelector('span').textContent = sub;
      if (tg.zoom) tg.zoom.firstChild.textContent = T.detail;
      tg.el.classList.toggle('is-done', n === title.length);
      tg.shown = n;
      tg.lang = lang;
    }
    const on = n > 0 ? 1 : 0;
    tg.line.style.opacity = on;
    tg.dot.style.opacity = on;

    let x, y;
    if (tg.tela) [x, y] = hudAnchor;
    else { const p = anchors[tg.key].clone().project(camera); x = (p.x * 0.5 + 0.5) * w; y = (-p.y * 0.5 + 0.5) * h; }
    const [fx, fy, edge] = narrow ? tg.narrow : tg.wide;
    const tw = Math.max(tg.el.offsetWidth, 1), th = tg.el.offsetHeight;
    const left = edge === 'left' ? fx * w : fx * w - tw;
    const top = fy * h;
    tg.el.style.transform = `translate(${left}px, ${top}px)`;
    // JN-style leader: from the part to the label, then an underline beneath it.
    const above = y < top;
    const baseY = above ? top - 6 : top + th + 6;
    const nearX = Math.abs(x - left) < Math.abs(x - (left + tw)) ? left : left + tw;
    const farX = nearX === left ? left + tw : left;
    tg.line.setAttribute('points', `${x},${y} ${nearX},${baseY} ${farX},${baseY}`);
    tg.dot.setAttribute('cx', x);
    tg.dot.setAttribute('cy', y);

    if (tg.zoom) {
      // Magnifier: a ring on the head, two lines to the box's near corners.
      const zoomOn = !narrow && tg.el.classList.contains('is-done');
      tg.line.style.opacity = narrow ? on : 0;
      tg.dot.style.opacity = narrow ? on : 0;
      tg.ring.style.opacity = tg.lines.style.opacity = zoomOn ? 1 : 0;

        const zx = left + tg.zoom.offsetLeft, zy = top + tg.zoom.offsetTop;
        const zw = tg.zoom.offsetWidth, zh = tg.zoom.offsetHeight;

        };

        tg.ring.setAttribute('cy', y);
        tg.lines.setAttribute('d', `M${edge(cx, zy)} L${cx},${zy} M${edge(cx, zy + zh)} L${cx},${zy + zh}`);

// Second camera for the close-up: in front of the forehead, turned a little
// toward the side the main camera sees, following the head as it moves.
const zoomCam = new THREE.PerspectiveCamera(30, 1, 0.02, 10);
function renderZoom() {
  if (!zoomRect || !EEG) return;
  const skull = skullWorld();
  const brow = skinPoint(eeg[0].vertex, new THREE.Vector3()).lerp(skinPoint(eeg[1].vertex, new THREE.Vector3()), 0.5);
  const fwd = brow.clone().sub(skull).normalize();
  const side = V(1, 0, 0).addScaledVector(fwd, -fwd.x).normalize();
  const upv = new THREE.Vector3().crossVectors(fwd, side).normalize();
  if (upv.y < 0) upv.negate();
  // Face level, a third of the way round to the side the main camera sees,
  // framed on the forehead pads with the band above and the eyes below.
  zoomCam.position.copy(brow)
    .addScaledVector(fwd, 0.29 * Math.cos(0.5))
    .addScaledVector(side, 0.29 * Math.sin(0.5))
    .addScaledVector(upv, -0.06);
  zoomCam.up.copy(upv);
  zoomCam.lookAt(brow.clone().addScaledVector(upv, -0.012));
  zoomCam.aspect = zoomRect.w / zoomRect.h;
  zoomCam.updateProjectionMatrix();
  const H = stage.clientHeight;
  const vy = H - zoomRect.y - zoomRect.h;
  renderer.shadowMap.autoUpdate = false;   // shadows were just drawn for this frame
  renderer.setScissorTest(true);
  renderer.setScissor(zoomRect.x, vy, zoomRect.w, zoomRect.h);
  renderer.setViewport(zoomRect.x, vy, zoomRect.w, zoomRect.h);
  renderer.render(scene, zoomCam);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, stage.clientWidth, H);
  renderer.shadowMap.autoUpdate = true;
}

  NDAnim.botao($('toggle'), playing, T);

  $('legend').innerHTML = TAGS.map((tg) => T.tags[tg.key]).map(([title, body], i) =>
    `<li><b><i>${String(i + 1).padStart(2, '0')}</i>${title}</b><p>${body}</p></li>`).join('');
}

let clock = 0, last = null, raf = 0, visible = true, frozen = false;

// Still frame for reduced motion and the poster: the tDCS at its plateau.
if (reduced && !frozen) clock = PERIOD * 2 + 4.2;
function frame(now) {
  if (last !== null && playing && !frozen) clock += Math.min(0.05, (now - last) / 1000);
  last = now;
  update(clock);

  composer.render();
  drawHud(clock);
  drawTags();
  renderZoom();

}
